# プロファイルのひな形。
#
# 対象ポータルごとに1ファイル作る。実サイトに向ける場合は
# base_url / listing / shop_link_pattern を差し替える。
# 判定ルール(rules)はサイトに依存しないので、そのまま使い回せる。

name: example_local_fixture
base_url: "http://127.0.0.1:8899"

# リクエスト間隔(秒)。相手サーバに負荷をかけないため、
# 実サイトでは 2.0 以上を強く推奨。
delay: 0.0

listing:
  # {page} が連番に置換される
  url_template: "http://127.0.0.1:8899/shop-list-page{page}.html"
  page_start: 1
  page_max: 10
  # 店舗詳細へのリンクを拾う正規表現。
  # グループ1があればそれを、なければマッチ全体をURLとして扱う。
  shop_link_pattern: 'href="(/shop/[^"]+\.html)"'

# 本文テキストに対するパターン照合。
# exclude が include に優先する（否定表現の方が確度が高いため）。
# 判定前に NFKC 正規化されるので「外国人ＯＫ」も「外国人OK」で拾える。
rules:
  foreigner_ok:
    include:
      - "外国人OK"
      - "外国人可"
      - "外国人歓迎"
      - "外国人の方も"
      - "英語対応"
      - "中国語対応"
      - "韓国語対応"
      - "English staff"
      - "English OK"
    exclude:
      - "外国人不可"
      - "外国人お断り"
      - "外国人NG"
      - "外国人の方はお断り"
      - "日本語が話せない方はお断り"
      - "日本語の話せない外国人"

  cancel_free:
    include:
      - "キャンセル料無料"
      - "キャンセル料は無料"
      - "キャンセル料金無料"
      - "キャンセル無料"
      - "キャンセル料はいただきません"
      - "キャンセル料金は発生しません"
    exclude:
      - "キャンセル料100%"
      - "キャンセル料が発生"
      - "キャンセル料をいただ"
      - "キャンセル料を申し受け"
      - "キャンセル料は全額"
