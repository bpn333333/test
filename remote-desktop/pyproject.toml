[project]
name = "rdcontrol"
version = "0.1.0"
description = "ローカルデスクトップをブラウザからリモート操作するアプリケーション"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mss>=9.0",
    "pillow>=10.0",
    "pynput>=1.7",
]

[project.scripts]
rdcontrol = "rdcontrol.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rdcontrol"]

[tool.setuptools.package-data]
rdcontrol = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
